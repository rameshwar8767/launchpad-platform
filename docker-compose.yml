services:
  # ---------------------------------------------------------------------------
  # Database Tier: PostgreSQL 16
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: launchpad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-launchpad_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-launchpad_password}
      POSTGRES_DB: ${POSTGRES_DB:-launchpad_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-launchpad_user} -d ${POSTGRES_DB:-launchpad_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - launchpad-net

  # ---------------------------------------------------------------------------
  # Backend API Tier: FastAPI (Python 3.13)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./application/backend
      dockerfile: Dockerfile
    container_name: launchpad-backend
    restart: unless-stopped
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-launchpad_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-launchpad_password}
      POSTGRES_DB: ${POSTGRES_DB:-launchpad_db}
      SECRET_KEY: ${SECRET_KEY:-launchpad-super-secret-dev-key-change-in-production-only}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BACKEND_CORS_ORIGINS: '["http://localhost:5173", "http://localhost:3000", "http://localhost:8080", "http://127.0.0.1:8080"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - launchpad-net

  # ---------------------------------------------------------------------------
  # Frontend UI Tier: React 19 SPA (Nginx Unprivileged)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./application/frontend
      dockerfile: Dockerfile
    container_name: launchpad-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - launchpad-net

# -----------------------------------------------------------------------------
# Storage & Networking Topologies
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local

networks:
  launchpad-net:
    driver: bridge
